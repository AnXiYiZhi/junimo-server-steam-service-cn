name: Publish Steam Service CN

on:
  workflow_call:
    inputs:
      fork_tag:
        description: Exact reviewed fork tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: release-steam-service-cn-${{ inputs.fork_tag }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: anxiyizhi/junimo-steam-service-cn
  ACR_REGISTRY: crpi-9z3bkb9g7fxeohrg.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_IMAGE: crpi-9z3bkb9g7fxeohrg.cn-hangzhou.personal.cr.aliyuncs.com/anxi-panel/junimo-steam-service-cn

jobs:
  release:
    name: Validate, build and publish steam-service-cn
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout exact fork tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.fork_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Parse strict release tag
        id: meta
        env:
          FORK_TAG: ${{ inputs.fork_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python .github/scripts/upstream_release.py release \
            --tag "$FORK_TAG" \
            --github-output "$GITHUB_OUTPUT"
          ghcr_owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_image=ghcr.io/${ghcr_owner}/junimo-steam-service-cn" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the tag contains the pinned Auth upstream release
        id: source
        env:
          RELEASE_SHA: ${{ steps.meta.outputs.release_sha }}
          UPSTREAM_TAG: ${{ steps.meta.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          upstream_revision="$(python .github/scripts/upstream_release.py source \
            --tag "$UPSTREAM_TAG" --manifest tools/steam-service/upstream-release.json)"
          git fetch --no-tags "https://github.com/stardew-valley-dedicated-server/server.git" "$upstream_revision"
          git merge-base --is-ancestor "$upstream_revision" "$RELEASE_SHA" || {
            echo "::error::Fork tag does not contain exact upstream tag ${UPSTREAM_TAG}."
            exit 1
          }
          echo "upstream_revision=$upstream_revision" >> "$GITHUB_OUTPUT"
          source_tree_sha256="$(git archive HEAD tools/steam-service Directory.Build.props CodeStyle.props .editorconfig | sha256sum | awk '{print $1}')"
          echo "source_tree_sha256=$source_tree_sha256" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Validate without Steam credentials
        run: |
          dotnet restore tools/steam-service.Tests/SteamService.Tests.csproj
          dotnet test tools/steam-service.Tests/SteamService.Tests.csproj -c Release --no-restore
          python .github/scripts/check_anxi_patch.py
          python -m unittest discover -s tests/workflows -p "test_*.py" -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact tags
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./tools/steam-service/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            AUTH_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REVISION=${{ steps.meta.outputs.release_sha }}
            SOURCE_TREE_SHA256=${{ steps.source.outputs.source_tree_sha256 }}
            UPSTREAM_REVISION=${{ steps.source.outputs.upstream_revision }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.ACR_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=junimo-steam-service-cn
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.release_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            io.anxi.upstream.tag=${{ steps.meta.outputs.upstream_tag }}
            io.anxi.upstream.revision=${{ steps.source.outputs.upstream_revision }}
            io.anxi.upstream.url=https://github.com/stardew-valley-dedicated-server/server/commit/${{ steps.source.outputs.upstream_revision }}
          cache-from: type=gha,scope=steam-service-cn
          cache-to: type=gha,mode=max,scope=steam-service-cn

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.fork_tag }}
          name: Junimo Steam Service CN ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          body: |
            Upstream: `${{ steps.meta.outputs.upstream_tag }}`
            Image tag: `${{ steps.meta.outputs.version }}`
            Image digest: `${{ steps.build.outputs.digest }}`

      - name: Notify Panel with public release metadata
        if: ${{ vars.PANEL_REPOSITORY != '' }}
        shell: bash
        env:
          PANEL_REPOSITORY: ${{ vars.PANEL_REPOSITORY }}
          PANEL_TOKEN: ${{ secrets.PANEL_REPOSITORY_DISPATCH_TOKEN }}
          UPSTREAM_TAG: ${{ steps.meta.outputs.upstream_tag }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ steps.meta.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ -z "$PANEL_TOKEN" ]; then
            echo "::notice::Panel dispatch token is not configured; skipping optional notification."
            exit 0
          fi
          case "$PANEL_REPOSITORY" in (*/*) ;; (*) exit 1;; esac
          payload="$(jq -cn \
            --arg upstreamRef "refs/tags/${UPSTREAM_TAG}" \
            --arg imageTag "$IMAGE_TAG" \
            --arg digest "$IMAGE_DIGEST" \
            --arg sourceRevision "$SOURCE_REVISION" \
            '{event_type:"steam-auth-cn-published",client_payload:{upstreamRef:$upstreamRef,imageTag:$imageTag,digest:$digest,sourceRevision:$sourceRevision}}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PANEL_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PANEL_REPOSITORY}/dispatches" \
            --data "$payload"
